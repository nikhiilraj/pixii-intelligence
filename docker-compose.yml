services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixii
      POSTGRES_PASSWORD: pixii
      POSTGRES_DB: pixii_intelligence
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixii -d pixii_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
